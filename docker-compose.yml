services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: placement_os
      POSTGRES_USER: placement
      POSTGRES_PASSWORD: placement
    ports:
      - "5432:5432"
    volumes:
      - placement-os-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement -d placement_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  placement-os-postgres:
